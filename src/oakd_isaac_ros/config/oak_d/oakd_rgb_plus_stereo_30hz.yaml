/oakd_camera:
  ros__parameters:
    camera:
      i_nn_type: none
      i_tf_base_frame: oak-d_frame
      i_tf_parent_frame: oak-d-base-frame
      # E: Target mode (RGB + StereoDepth + raw left/right)
      i_pipeline_type: RGBD

    pipeline_gen:
      i_enable_diagnostics: true
      i_enable_imu: false
      i_enable_sync: false

    rgb:
      # ON: RGB path
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 1080P
      i_output_isp: true
      i_set_isp_scale: true
      i_isp_num: 2
      i_isp_den: 3
      i_low_bandwidth: false

    left:
      # ON: raw stereo left
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 400P
      i_low_bandwidth: false

    right:
      # ON: raw stereo right
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 400P
      i_low_bandwidth: false

    stereo:
      # OFF: depth stream; keep load focused on raw stereo + RGB coexistence
      i_publish_topic: false
      i_align_depth: false
      i_low_bandwidth: false
      i_lr_check: true
      i_subpixel: false

      # OFF: rectified outputs in this stage
      i_left_rect_publish_topic: false
      i_right_rect_publish_topic: false
      i_publish_synced_rect_pair: false
