/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_tf_base_frame: oak-d_frame
      i_tf_parent_frame: oak-d-base-frame
      i_pipeline_type: RGBD
      i_enable_sync: true
    nn:
      i_nn_config_path: depthai_ros_driver/mobilenet
    pipeline_gen:
      i_enable_diagnostics: false
      i_enable_imu: false
      i_enable_sync: true
    left:
      i_publish_topic: false
      i_fps: 30.0
      i_resolution: 800P
      i_low_bandiwdth_frame_freq: 30
      i_low_bandwidth: false
      i_synced: true
      r_exposure: 10000
      r_iso: 200
      r_set_man_exposure: true  #setting the exposure manually, to low ISO and long exposure time, increases low light performance

    right:
      i_publish_topic: false
      i_fps: 30.0
      i_resolution: 800P
      i_low_bandiwdth_frame_freq: 30
      i_low_bandwidth: false
      i_synced: true
      r_exposure: 10000
      r_iso: 200
      r_set_man_exposure: true  #setting the exposure manually, to low ISO and long exposure time, increases low light performance
    rgb:
      i_resolution: 1080P
      i_fps: 30.0
      i_low_bandiwdth_frame_freq: 30
      i_low_bandwidth: false
      i_low_bandwidth_bitrate: 2000000
      i_low_bandwidth_ffmpeg_encoder: libx264
      i_low_bandwidth_profile: 4
      i_low_bandwidth_quality: 60
      i_publish_compressed: false
      i_publish_topic: true
      i_output_isp: false
      i_isp_den: 3
      i_isp_num: 2
    stereo:
      i_publish_topic: false
      i_low_bandwidth: false
      i_synced: true

      i_left_rect_publish_topic: true
      i_right_rect_publish_topic: true

      i_right_rect_add_exposure_offset: false
      i_right_rect_enable_feature_tracker: false
      i_right_rect_exposure_offset: 0
      i_right_rect_low_bandwidth: true
      i_right_rect_low_bandwidth_bitrate: 0
      i_right_rect_low_bandwidth_ffmpeg_encoder: libx264
      i_right_rect_low_bandwidth_frame_freq: 30
      i_right_rect_low_bandwidth_profile: 4
      i_right_rect_low_bandwidth_quality: 75
      i_right_rect_publish_compressed: true
      i_right_rect_synced: true
      i_right_socket_id: 2
      i_left_rect_add_exposure_offset: false
      
      i_left_rect_enable_feature_tracker: false
      i_left_rect_exposure_offset: 0
      i_left_rect_low_bandwidth: true
      i_left_rect_low_bandwidth_bitrate: 0
      i_left_rect_low_bandwidth_ffmpeg_encoder: libx264
      i_left_rect_low_bandwidth_frame_freq: 30
      i_left_rect_low_bandwidth_profile: 4
      i_left_rect_low_bandwidth_quality: 75
      i_left_rect_publish_compressed: true
      i_left_rect_synced: true
      i_left_socket_id: 1

      
      i_align_depth: true
      i_stereo_conf_threshold: 220
      i_lr_check: false
      i_subpixel: false
      i_subpixel_fractional_bits: 4
      i_enable_temporal_filter: true
      i_temporal_filter_alpha: 0.4
      i_temporal_filter_delta: 60
      i_temporal_filter_persistency: VALID_2_IN_LAST_4
      i_enable_speckle_filter: false
      i_speckle_filter_speckle_range: 12
      i_spatial_filter_hole_filling_radius: 3
      i_spatial_filter_alpha: 0.5
      i_spatial_filter_delta: 30
      i_spatial_filter_iterations: 2
      i_enable_decimation_filter: false
      i_decimation_filter_decimation_mode: PIXEL_SKIPPING
      i_decimation_filter_decimation_factor: 2
    imu:
      i_acc_cov: 0.0
      i_acc_freq: 200
      i_batch_report_threshold: 5
      i_enable_rotation: false
      i_get_base_device_timestamp: false
      i_gyro_cov: 0.0
      i_gyro_freq: 200
      i_mag_cov: 0.0
      i_max_batch_reports: 10
      i_message_type: IMU
      i_rot_cov: -1.0
      i_sync_method: LINEAR_INTERPOLATE_ACCEL
      i_update_ros_base_time_on_ros_msg: false
        
      