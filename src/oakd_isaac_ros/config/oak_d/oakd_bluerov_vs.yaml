/oak:
  ros__parameters:
    driver:
      i_ip: "10.1.1.210"
    pipeline_gen:
      i_nn_type: none
      i_enable_rgbd: false
      i_pipeline_type: RGB
    stereo:
      i_depth_preset: ROBOTICS
      i_publish_topic: false
      i_fps: 10.0
      aligned: true
      i_low_bandwidth: true
    rgb:
      i_fps: 60.0
      i_publish_topic: true
      i_low_bandwidth: true
      i_resolution: 1080P

      r_set_man_exposure: true
      r_iso: 1200 # increasing the ISO
      r_exposure: 3000  # increasing the exposure