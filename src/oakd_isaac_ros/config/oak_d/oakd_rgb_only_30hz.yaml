/oakd_camera:
  ros__parameters:
    camera:
      i_nn_type: none
      i_tf_base_frame: oak-d_frame
      i_tf_parent_frame: oak-d-base-frame
      # D: RGB-only baseline
      i_pipeline_type: RGB

    pipeline_gen:
      i_enable_diagnostics: true
      i_enable_imu: false
      i_enable_sync: false

    rgb:
      # ON: RGB at 30 Hz
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 1080P
      i_output_isp: true
      i_set_isp_scale: true
      i_isp_num: 2
      i_isp_den: 3
      i_low_bandwidth: false

    # OFF: mono paths
    left:
      i_disable_node: true

    right:
      i_disable_node: true
