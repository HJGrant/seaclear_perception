/oakd_camera:
  ros__parameters:
    camera:
      i_nn_type: none
      i_tf_base_frame: oak-d_frame
      i_tf_parent_frame: oak-d-base-frame
      # Stereo-only baseline at 400P to verify host-side throughput ceiling.
      i_pipeline_type: Stereo

    pipeline_gen:
      i_enable_diagnostics: true
      i_enable_imu: false
      i_enable_sync: false

    left:
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 400P
      i_low_bandwidth: false

    right:
      i_publish_topic: true
      i_fps: 30.0
      i_resolution: 400P
      i_low_bandwidth: false

    rgb:
      i_disable_node: true
