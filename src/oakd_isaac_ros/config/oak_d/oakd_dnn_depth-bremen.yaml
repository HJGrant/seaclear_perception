/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_tf_base_frame: oak-d_frame
      i_tf_parent_frame: oak-d-base-frame
      i_pipeline_type: RGBD
      i_enable_sync: false
      i_ip: "192.168.2.109"
      #i_ip: "10.1.1.210" # IP for the camera in the BlueROV setup

    pipeline_gen:
      i_enable_diagnostics: true
      i_enable_imu: true
      i_enable_sync: false

    left:
      i_publish_topic: false
      i_fps: 10.0
      i_resolution: 400P
      #i_low_bandiwdth_frame_freq: 30
      #i_low_bandwidth: false
      #i_synced: true
      #r_exposure: 10000
      #r_iso: 200
      #r_set_man_exposure: true

    right:
      i_publish_topic: false
      i_fps: 10.0
      i_resolution: 400P
      #i_low_bandiwdth_frame_freq: 30
      #i_low_bandwidth: false
      #i_synced: true
      #r_exposure: 10000
      #r_iso: 200
      #r_set_man_exposure: true  #setting the exposure manually, to low ISO and long exposure time, increases low light performance

    rgb:
      i_publish_topic: true
      # IMX378 doesn't support 720P natively (driver was silently falling
      # back to 1080P and letting a GPU resize node downstream scale it to
      # 1280x720 -- that resize competed with TensorRT for the same GPU,
      # which is why RGB RTP latency tracked detection load). 1080P with
      # 2/3 ISP scaling is computed on the camera's own ISP hardware
      # instead, so both the detection and RTP paths get native 1280x720
      # with zero host GPU/CPU cost.
      i_resolution: 1080P
      i_fps: 60.0
      i_low_bandwidth_frame_freq: 60
      i_low_bandwidth: true
      i_low_bandwidth_bitrate: 6000000
      #i_low_bandwidth_ffmpeg_encoder: libx264
      #i_low_bandwidth_profile: 4
      #i_low_bandwidth_quality: 75
      #i_publish_compressed: false
      #i_publish_topic: true
      #i_output_isp: false
      i_isp_den: 3
      i_isp_num: 2

    stereo:
      i_publish_topic: true
      i_low_bandwidth: false
      i_synced: false
      i_align_depth: true

      i_left_rect_publish_topic: false
      i_right_rect_publish_topic: false

      #i_right_rect_add_exposure_offset: false
      #i_right_rect_enable_feature_tracker: false
      #i_right_rect_exposure_offset: 0
      #i_right_rect_low_bandwidth: false
      #i_right_rect_low_bandwidth_bitrate: 0
      #i_right_rect_low_bandwidth_ffmpeg_encoder: libx264
      #i_right_rect_low_bandwidth_frame_freq: 30
      #i_right_rect_low_bandwidth_profile: 4
      #i_right_rect_low_bandwidth_quality: 75
      #i_right_rect_publish_compressed: false
      #i_right_rect_synced: true
      #i_right_socket_id: 2
      #i_left_rect_add_exposure_offset: false
      
      #i_left_rect_enable_feature_tracker: false
      #i_left_rect_exposure_offset: 0
      #i_left_rect_low_bandwidth: false
      #i_left_rect_low_bandwidth_bitrate: 0
      #i_left_rect_low_bandwidth_ffmpeg_encoder: libx264
      #i_left_rect_low_bandwidth_frame_freq: 30
      #i_left_rect_low_bandwidth_profile: 4
      #i_left_rect_low_bandwidth_quality: 75
      #i_left_rect_publish_compressed: false
      #i_left_rect_synced: true
      #i_left_socket_id: 1

    imu:
      i_acc_cov: 0.0
      i_acc_freq: 200
      i_batch_report_threshold: 5
      i_enable_rotation: false
      i_get_base_device_timestamp: false
      i_gyro_cov: 0.0
      i_gyro_freq: 200
      i_mag_cov: 0.0
      i_max_batch_reports: 10
      i_message_type: IMU
      i_rot_cov: -1.0
      i_sync_method: LINEAR_INTERPOLATE_ACCEL
      i_update_ros_base_time_on_ros_msg: false
